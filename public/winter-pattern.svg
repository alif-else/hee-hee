<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="360" viewBox="0 0 360 360">
  <!-- Winter doodle tile: pine, snow, cloud, beanie, mitten, boot, shovel, snowflakes.
       Seamless 360x360 tile. Colors are pastel versions of the pine loader palette. -->
  <defs>
    <g id="pine" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 3 L27 13 H23.5 L30 23 H25.5 L33 34 H7 L14.5 23 H10 L16.5 13 H13 Z"/>
      <path d="M18 34 V40 H22 V34"/>
      <path d="M15.5 13.5 q2 1.6 4.5 0 q2.5 1.6 4.5 0" opacity=".7"/>
      <path d="M12 23.5 q2.6 2 5.3 0 q2.7 2 5.4 0 q2.6 2 5.3 0" opacity=".7"/>
    </g>
    <g id="flake" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <g id="arm"><path d="M20 20 V5 M16.5 8.5 L20 12 L23.5 8.5"/></g>
      <use href="#arm" xlink:href="#arm" transform="rotate(60 20 20)"/>
      <use href="#arm" xlink:href="#arm" transform="rotate(120 20 20)"/>
      <use href="#arm" xlink:href="#arm" transform="rotate(180 20 20)"/>
      <use href="#arm" xlink:href="#arm" transform="rotate(240 20 20)"/>
      <use href="#arm" xlink:href="#arm" transform="rotate(300 20 20)"/>
    </g>
    <g id="cloud" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 30 H33 a6.5 6.5 0 0 0 0-13 a9.5 9.5 0 0 0-18-2.5 a7.5 7.5 0 0 0-4 15.5 Z"/>
      <path d="M14 36 h6 M25 36 h3" opacity=".7"/>
    </g>
    <g id="beanie" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="7" r="3.5"/>
      <path d="M7 27 a13 15 0 0 1 26 0"/>
      <rect x="5" y="27" width="30" height="8" rx="2.5"/>
      <path d="M11 27.5 v7 M17 27.5 v7 M23 27.5 v7 M29 27.5 v7" opacity=".6"/>
      <path d="M12 20 q8 -4 16 0" opacity=".6"/>
    </g>
    <g id="mitten" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 31 V18 c0-8 3.5-13 9-13 s9 5 9 12.5 V31 Z"/>
      <path d="M13 23 c-5 0-8-4-6.5-7.5 c1.4-3 5-2 6.5 0.5"/>
      <rect x="12" y="31" width="20" height="6" rx="2"/>
      <path d="M18 15 l2 2 l2-2 M23 21 l2 2 l2-2" opacity=".6"/>
    </g>
    <g id="boot" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4 H24 V23 L33 27 a4 4 0 0 1 3 4 V35 H11 Z"/>
      <path d="M9 4 H26" />
      <path d="M11 35 v2.5 H36 V35" />
      <path d="M17 11 h4 M17 16 h4 M17 21 h4" opacity=".6"/>
    </g>
    <g id="shovel" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 4 H25 M17 4 a3 3 0 0 0 6 0" />
      <path d="M20 7 V24"/>
      <path d="M12 24 H28 L26 36 Q20 39 14 36 Z"/>
      <path d="M17 28 v5 M23 28 v5" opacity=".5"/>
    </g>
    <g id="dots" fill="currentColor">
      <circle cx="4" cy="4" r="1.4"/><circle cx="13" cy="2" r="1.1"/><circle cx="9" cy="10" r="1.3"/>
      <circle cx="19" cy="8" r="1"/><circle cx="16" cy="15" r="1.3"/><circle cx="3" cy="16" r="1"/>
    </g>
    <g id="drift" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 2 h7 M11 2 h7 M22 2 h7 M33 2 h7"/>
      <path d="M5 9 h7 M16 9 h7 M27 9 h7"/>
      <path d="M0 16 h7 M11 16 h7 M22 16 h7 M33 16 h7"/>
    </g>
    <g id="spark" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M6 0 V12 M0 6 H12 M2 2 L10 10 M10 2 L2 10"/>
    </g>
    <g id="hill" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 10 q8 -9 16 -2 q7 -7 14 1"/>
    </g>
  </defs>

  <!-- palette (pastel loader tones) -->
  <!-- green #82b38c  deep pine #5f8f72  snow blue #8db8de  sky purple #a98bd0
       lavender #c8b2e8  pink #e6a9c6  trunk #b78d6d  ink #4a5478  ice #7fc6de -->

  <use href="#pine"   xlink:href="#pine"   x="0" y="0" color="#82b38c" transform="translate(22 18) rotate(-8 20 20)"/>
  <use href="#flake"  xlink:href="#flake"  color="#4a5478" transform="translate(108 30) scale(.62)"/>
  <use href="#cloud"  xlink:href="#cloud"  color="#8db8de" transform="translate(170 10)"/>
  <use href="#beanie" xlink:href="#beanie" color="#a98bd0" transform="translate(282 24) rotate(12 20 20)"/>
  <use href="#spark"  xlink:href="#spark"  color="#e6a9c6" transform="translate(240 70)"/>

  <use href="#drift"  xlink:href="#drift"  color="#7fc6de" transform="translate(58 98)"/>
  <use href="#mitten" xlink:href="#mitten" color="#e6a9c6" transform="translate(142 84) rotate(-16 20 20)"/>
  <use href="#dots"   xlink:href="#dots"   color="#a98bd0" transform="translate(226 112)"/>
  <use href="#boot"   xlink:href="#boot"   color="#b78d6d" transform="translate(298 104) rotate(8 20 20)"/>
  <use href="#spark"  xlink:href="#spark"  color="#4a5478" transform="translate(16 92) scale(.8)"/>

  <use href="#flake"  xlink:href="#flake"  color="#a98bd0" transform="translate(16 146) scale(.8)"/>
  <use href="#shovel" xlink:href="#shovel" color="#b78d6d" transform="translate(92 150) rotate(24 20 20)"/>
  <use href="#pine"   xlink:href="#pine"   color="#5f8f72" transform="translate(196 146) rotate(6 20 20)"/>
  <use href="#cloud"  xlink:href="#cloud"  color="#c8b2e8" transform="translate(270 184) scale(.9)"/>
  <use href="#hill"   xlink:href="#hill"   color="#8db8de" transform="translate(150 214)"/>

  <use href="#beanie" xlink:href="#beanie" color="#e6a9c6" transform="translate(36 236) rotate(-10 20 20)"/>
  <use href="#flake"  xlink:href="#flake"  color="#8db8de" transform="translate(118 260) scale(.7)"/>
  <use href="#mitten" xlink:href="#mitten" color="#a98bd0" transform="translate(214 246) rotate(18 20 20)"/>
  <use href="#drift"  xlink:href="#drift"  color="#7fc6de" transform="translate(292 272)"/>
  <use href="#dots"   xlink:href="#dots"   color="#e6a9c6" transform="translate(88 214)"/>
  <use href="#spark"  xlink:href="#spark"  color="#4a5478" transform="translate(268 236) scale(.8)"/>

  <use href="#boot"   xlink:href="#boot"   color="#4a5478" transform="translate(12 306) rotate(-6 20 20) scale(.9)"/>
  <use href="#pine"   xlink:href="#pine"   color="#82b38c" transform="translate(150 300) rotate(-4 20 20) scale(.9)"/>
  <use href="#shovel" xlink:href="#shovel" color="#b78d6d" transform="translate(246 300) rotate(-22 20 20) scale(.9)"/>
  <use href="#flake"  xlink:href="#flake"  color="#4a5478" transform="translate(318 330) scale(.55)"/>
  <use href="#spark"  xlink:href="#spark"  color="#a98bd0" transform="translate(98 334) scale(.8)"/>
  <use href="#dots"   xlink:href="#dots"   color="#8db8de" transform="translate(326 160)"/>
</svg>
