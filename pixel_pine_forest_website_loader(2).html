<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pine Forest Website Loader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    /* Crisp pixel rendering for our low-res pixel art canvas */
    canvas.pixelated {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Transparent checkerboard pattern for previewing alpha edges */
    .bg-checkerboard {
      background-color: #f8fafc;
      background-image: 
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    /* Blinking pixel typewriter cursor */
    @keyframes pixelBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .pixel-cursor {
      display: inline;
    }

    .pixel-cursor::after {
      content: '▮';
      display: inline-block;
      margin-left: 4px;
      font-size: 0.9em;
      line-height: 1;
      vertical-align: baseline;
      animation: pixelBlink 1s steps(1, end) infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col justify-between selection:bg-purple-200 selection:text-purple-900">

  <!-- Top Minimal Header -->
  <header class="w-full border-b border-slate-200/80 bg-white/80 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-sm bg-emerald-600 inline-block shadow-sm"></span>
        <h1 class="text-sm sm:text-base font-semibold tracking-tight text-slate-900">
          Pixel Pine Forest Loader
        </h1>
        <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
          160×136 Native Pixel Grid
        </span>
      </div>

      <!-- Copy Standalone Code Button -->
      <button
        id="copySnippetBtn"
        type="button"
        class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-900 text-white hover:bg-slate-800 active:scale-[0.98] transition shadow-sm cursor-pointer"
      >
        <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span>Copy Embeddable HTML/CSS/JS Snippet</span>
      </button>
    </div>
  </header>

  <!-- Main Interactive Preview Stage -->
  <main id="previewStage" class="flex-1 flex flex-col items-center justify-center p-6 sm:p-10 transition-colors duration-300 bg-white">
    
    <!-- Loader Wrapper (What gets embedded in a real site) -->
    <div id="loaderWidget" class="flex flex-col items-center justify-center select-none max-w-full">
      <!-- Native 160x136 pixel art canvas scaled cleanly via CSS -->
      <canvas
        id="pineLoaderCanvas"
        width="160"
        height="136"
        class="pixelated block"
        style="width: 320px; height: 272px;"
        aria-label="Miniature snowy pine wood floating island loading animation"
      ></canvas>

      <!-- Pixel Typewriter Poem & Synchronized Progress Bar -->
      <div class="mt-4 flex flex-col items-center gap-3 w-full max-w-md px-2">
        <p
          id="loaderText"
          aria-live="polite"
          class="font-pixel text-[9px] sm:text-[10px] leading-relaxed tracking-wide text-slate-700 text-center min-h-[1.75rem] flex items-center justify-center transition-colors duration-300 pixel-cursor"
        ></p>

        <!-- Synchronized pixel progress bar -->
        <div id="progressBarWrap" class="w-48 sm:w-56 h-2.5 bg-slate-200/80 p-0.5 rounded-none border border-slate-400/60">
          <div id="progressBarFill" class="h-full bg-emerald-600 transition-[width] duration-75 ease-linear" style="width: 0%;"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Developer Controls Bar -->
  <footer class="w-full border-t border-slate-200/80 bg-white/95 backdrop-blur-md z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4 text-xs sm:text-sm">
      
      <!-- Background Theme Switcher -->
      <div class="flex items-center gap-2">
        <span class="text-slate-500 font-medium">Stage:</span>
        <div class="inline-flex rounded-lg bg-slate-100 p-1 border border-slate-200/70" role="group">
          <button
            type="button"
            data-bg="light"
            class="bg-toggle-btn px-3 py-1.5 rounded-md font-medium bg-white text-slate-900 shadow-xs transition cursor-pointer"
          >
            Light
          </button>
          <button
            type="button"
            data-bg="dark"
            class="bg-toggle-btn px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer"
          >
            Dark
          </button>
          <button
            type="button"
            data-bg="checker"
            class="bg-toggle-btn px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer"
          >
            Transparent
          </button>
        </div>
      </div>

      <!-- Pixel Scale Switcher -->
      <div class="flex items-center gap-2">
        <span class="text-slate-500 font-medium">Scale:</span>
        <div class="inline-flex rounded-lg bg-slate-100 p-1 border border-slate-200/70" role="group">
          <button
            type="button"
            data-scale="1"
            class="scale-btn px-2.5 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer"
          >
            1x
          </button>
          <button
            type="button"
            data-scale="2"
            class="scale-btn px-2.5 py-1.5 rounded-md font-medium bg-white text-slate-900 shadow-xs transition cursor-pointer"
          >
            2x
          </button>
          <button
            type="button"
            data-scale="3"
            class="scale-btn px-2.5 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer"
          >
            3x
          </button>
        </div>
      </div>

      <!-- Pixel Progress Bar Visibility Toggle -->
      <div class="flex items-center gap-2">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none text-slate-600 hover:text-slate-900">
          <input id="toggleProgress" type="checkbox" checked class="rounded border-slate-300 text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer" />
          <span class="font-medium">Show Pixel Progress Bar</span>
        </label>
      </div>

    </div>
  </footer>

  <!-- Toast Notification -->
  <div
    id="toastNotification"
    role="status"
    class="fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-all duration-200 flex items-center gap-2 z-50"
  >
    <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    <span>Standalone HTML/CSS/JS loader snippet copied to clipboard!</span>
  </div>

  <!-- Hidden textarea used for reliable clipboard copy inside sandboxed iframes -->
  <textarea id="clipboardHelper" class="sr-only" aria-hidden="true"></textarea>

  <script>
    (function () {
      const canvas = document.getElementById('pineLoaderCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      ctx.imageSmoothingEnabled = false;

      // Native pixel art resolution (160 x 136)
      const W = 160;
      const H = 136;

      // Offscreen buffer for static background dome + island so rendering is ultra-crisp and fast
      const staticBuffer = document.createElement('canvas');
      staticBuffer.width = W;
      staticBuffer.height = H;
      const sctx = staticBuffer.getContext('2d', { alpha: true });
      sctx.imageSmoothingEnabled = false;

      // Color Palette strictly matching the approved illustration:
      // Purple ONLY in the sky dome; strictly earthy browns, greens, and snow whites on the island
      const PAL = {
        outline: '#161b18',
        sky1: '#2b134d',
        sky2: '#3f1c6e',
        sky3: '#56278e',
        sky4: '#7238a8',
        sky5: '#9452bd',
        sky6: '#b675cf',
        skyGlow: '#d199db',
        starWhite: '#ffffff',
        starLavender: '#e3b8ff',
        starPink: '#f7c6f2',
        trunkDark: '#472511',
        trunkMid: '#6e3b1b',
        trunkLight: '#945429',
        pineDark: '#173d24',
        pineMid: '#266134',
        pineBright: '#3d8c40',
        pineLime: '#63b349',
        pineHighlight: '#8cd15a',
        snowShadow: '#9fc5e8',
        snowMid: '#cfe6fa',
        snowBright: '#ffffff',
        grassDark: '#234a1c',
        grassMid: '#3d7a24',
        grassLight: '#63a82c',
        grassTip: '#89cc3d',
        mudOutline: '#1c120c',
        mudDark: '#3d2312',
        mudMid: '#5c361c',
        mudLight: '#7a4a27',
        mudHighlight: '#965e34'
      };

      function px(targetCtx, x, y, color) {
        targetCtx.fillStyle = color;
        targetCtx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
      }

      function rect(targetCtx, x, y, w, h, color) {
        targetCtx.fillStyle = color;
        targetCtx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
      }

      const domeCX = 80;
      const domeCY = 68;
      const domeR = 54;

      function isInsideSkyDome(x, y) {
        const dx = x - domeCX;
        const dy = y - domeCY;
        const distSq = dx * dx + dy * dy;
        return distSq <= domeR * domeR && y <= 93;
      }

      function buildStaticScene() {
        sctx.clearRect(0, 0, W, H);

        // --- A. NIGHT SKY DOME (Concentric Pixel Bands) ---
        const glowCX = 80;
        const glowCY = 77;
        for (let y = 12; y <= 94; y++) {
          for (let x = 24; x <= 136; x++) {
            const dx = x - domeCX;
            const dy = y - domeCY;
            const dDome = Math.sqrt(dx * dx + dy * dy);
            if (dDome <= domeR && y <= 92) {
              const gx = (x - glowCX) * 0.92;
              const gy = (y - glowCY) * 1.08;
              const dGlow = Math.sqrt(gx * gx + gy * gy);

              let col = PAL.sky1;
              if (dGlow < 17) col = PAL.skyGlow;
              else if (dGlow < 24) col = PAL.sky6;
              else if (dGlow < 31) col = PAL.sky5;
              else if (dGlow < 38) col = PAL.sky4;
              else if (dGlow < 45) col = PAL.sky3;
              else if (dGlow < 52) col = PAL.sky2;
              else col = PAL.sky1;

              if (dDome > domeR - 1.15) {
                col = '#220e3d';
              }
              px(sctx, x, y, col);
            }
          }
        }

        const staticStars = [
          [53, 35, PAL.starLavender], [67, 24, PAL.starWhite], [83, 21, PAL.starPink],
          [98, 25, PAL.starWhite], [112, 34, PAL.starLavender], [43, 47, PAL.starWhite],
          [119, 46, PAL.starWhite], [37, 61, PAL.starLavender], [124, 62, PAL.starLavender],
          [46, 73, PAL.starWhite], [115, 74, PAL.starWhite], [60, 42, PAL.starPink],
          [102, 41, PAL.starLavender], [75, 31, PAL.starLavender], [91, 32, PAL.starWhite],
          [34, 75, PAL.starWhite], [127, 76, PAL.starWhite], [52, 56, PAL.starWhite],
          [109, 55, PAL.starPink]
        ];
        staticStars.forEach(([sx, sy, scol]) => {
          if (isInsideSkyDome(sx, sy)) px(sctx, sx, sy, scol);
        });

        // --- B. PINE TREES CLUSTER ---
        function drawPineTree(cx, baseY, height, maxHalfW, style) {
          const topY = baseY - height;
          const trunkH = Math.max(5, Math.round(height * 0.19));
          const foliageBottomY = baseY - trunkH;
          const foliageH = foliageBottomY - topY;

          const trunkW = maxHalfW >= 13 ? 4 : 3;
          const tx = Math.round(cx - trunkW / 2);
          rect(sctx, tx - 1, foliageBottomY - 1, trunkW + 2, trunkH + 2, PAL.outline);
          rect(sctx, tx, foliageBottomY, trunkW, trunkH, PAL.trunkMid);
          rect(sctx, tx, foliageBottomY, 1, trunkH, PAL.trunkDark);
          if (trunkW >= 4) {
            rect(sctx, tx + 2, foliageBottomY, 1, trunkH, PAL.trunkLight);
          }

          const tiers = maxHalfW >= 13 ? 5 : 4;
          const foliagePixels = new Map();

          for (let t = 0; t < tiers; t++) {
            const tRatio0 = t / tiers;
            const tRatio1 = (t + 1.22) / tiers;
            const tierTop = Math.round(topY + foliageH * tRatio0 * 0.86);
            const tierBot = Math.min(foliageBottomY, Math.round(topY + foliageH * Math.min(1, tRatio1)));
            const tierMaxW = Math.max(2, Math.round(maxHalfW * (0.34 + 0.66 * ((t + 1) / tiers))));

            for (let y = tierTop; y <= tierBot; y++) {
              const localProgress = (y - tierTop) / Math.max(1, tierBot - tierTop);
              let halfW = Math.round(tierMaxW * Math.pow(localProgress, 0.85));
              if (y === tierBot && tierMaxW > 3) halfW += 1;

              for (let dx = -halfW; dx <= halfW; dx++) {
                const x = cx + dx;
                const normX = dx / Math.max(1, halfW);

                let col = style === 'lime' ? PAL.pineLime : PAL.pineBright;
                if (normX < -0.45) {
                  col = style === 'lime' ? PAL.pineBright : PAL.pineMid;
                } else if (normX > 0.35 || localProgress > 0.78) {
                  col = style === 'lime' ? PAL.pineMid : PAL.pineDark;
                }
                if (style === 'lime' && normX < -0.1 && localProgress < 0.45) {
                  col = PAL.pineHighlight;
                }

                if (y === tierBot && Math.abs(dx) % 2 === 1) {
                  col = PAL.pineDark;
                }

                const hasSnowShelf =
                  (t < tiers - 1 && localProgress >= 0.48 && localProgress <= 0.76 && Math.abs(dx) <= halfW - 1) ||
                  (t === 0 && localProgress <= 0.45 && Math.abs(dx) <= 1);

                if (hasSnowShelf) {
                  const snowNoise = ((x * 7 + y * 13 + t * 5) % 5);
                  if (snowNoise !== 0) {
                    col = localProgress > 0.66 ? PAL.snowShadow : PAL.snowBright;
                  }
                }

                foliagePixels.set(`${x},${y}`, col);
              }
            }
          }

          foliagePixels.forEach((_, key) => {
            const [x, y] = key.split(',').map(Number);
            const neighbors = [
              [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]
            ];
            neighbors.forEach(([nx, ny]) => {
              if (!foliagePixels.has(`${nx},${ny}`)) {
                px(sctx, nx, ny, PAL.outline);
              }
            });
          });

          foliagePixels.forEach((col, key) => {
            const [x, y] = key.split(',').map(Number);
            px(sctx, x, y, col);
          });
        }

        drawPineTree(64, 86, 34, 10, 'lime');
        drawPineTree(83, 85, 33, 10, 'emerald');
        drawPineTree(95, 87, 29, 9, 'lime');
        drawPineTree(54, 90, 30, 10, 'emerald');
        drawPineTree(105, 90, 25, 8, 'lime');
        drawPineTree(76, 89, 39, 14, 'emerald');

        // --- C. FLOATING ISLAND TERRAIN ---
        const islandPixels = new Map();

        for (let x = 28; x <= 132; x++) {
          const nx = (x - 80) / 52;
          if (Math.abs(nx) > 1) continue;

          const edgeDrop = Math.pow(Math.abs(nx), 2.4) * 7;
          const waveTop = Math.sin(x * 0.22) * 1.2 + Math.cos(x * 0.45) * 0.7;
          const topY = Math.round(87 + edgeDrop + waveTop);

          const archBottom = Math.cos(nx * (Math.PI * 0.5)) * 12;
          const centerVPeak = Math.max(0, 1 - Math.abs(x - 79) / 14) * 8;
          const leftCrag = Math.exp(-Math.pow((x - 53) / 7, 2)) * 3.5;
          const rightCrag = Math.exp(-Math.pow((x - 105) / 7, 2)) * 3;
          const jagged = Math.sin(x * 0.52) * 1.1;

          const bottomY = Math.round(94 + archBottom + centerVPeak + leftCrag + rightCrag + jagged);

          const snowMask = Math.cos(nx * (Math.PI * 0.52));
          const snowThick = snowMask > 0.28
            ? Math.max(0, Math.round(snowMask * 7 + Math.sin(x * 0.35) * 1.2))
            : 0;

          const grassThick = Math.round(4 + Math.abs(Math.sin(x * 0.4)) * 2.5);

          for (let y = topY; y <= bottomY; y++) {
            const depthFromTop = y - topY;
            const distFromBottom = bottomY - y;
            let col = PAL.mudMid;

            if (depthFromTop < snowThick) {
              if (depthFromTop === 0) {
                col = PAL.snowBright;
              } else if (depthFromTop >= snowThick - 1) {
                col = PAL.snowShadow;
              } else {
                col = PAL.snowMid;
              }
            } else if (depthFromTop < snowThick + grassThick) {
              const grassRel = depthFromTop - snowThick;
              if (grassRel === 0) {
                col = (x % 3 === 0) ? PAL.grassTip : PAL.grassLight;
              } else if (grassRel >= grassThick - 1) {
                col = PAL.grassDark;
              } else {
                col = ((x + y) % 4 === 0) ? PAL.grassLight : PAL.grassMid;
              }
            } else {
              const shadeNoise = (x * 11 + y * 17) % 7;
              if (distFromBottom <= 2 || nx > 0.45) {
                col = PAL.mudDark;
              } else if (nx < -0.2 && shadeNoise < 3) {
                col = PAL.mudHighlight;
              } else if (shadeNoise < 4) {
                col = PAL.mudLight;
              } else {
                col = PAL.mudMid;
              }
            }

            islandPixels.set(`${x},${y}`, col);
          }
        }

        const snowPatches = [
          [38, 91, 7, 2],
          [46, 94, 5, 2],
          [74, 96, 6, 2],
          [116, 90, 6, 2]
        ];
        snowPatches.forEach(([sx, sy, sw, sh]) => {
          for (let pyOffset = 0; pyOffset < sh; pyOffset++) {
            for (let pxOffset = 0; pxOffset < sw; pxOffset++) {
              const key = `${sx + pxOffset},${sy + pyOffset}`;
              if (islandPixels.has(key)) {
                islandPixels.set(key, pyOffset === 0 ? PAL.snowBright : PAL.snowShadow);
              }
            }
          }
        });

        islandPixels.forEach((_, key) => {
          const [x, y] = key.split(',').map(Number);
          const neighbors = [
            [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]
          ];
          neighbors.forEach(([nx, ny]) => {
            if (!islandPixels.has(`${nx},${ny}`)) {
              const outlineCol = ny < 95 ? PAL.outline : PAL.mudOutline;
              px(sctx, nx, ny, outlineCol);
            }
          });
        });

        islandPixels.forEach((col, key) => {
          const [x, y] = key.split(',').map(Number);
          px(sctx, x, y, col);
        });

        const trunkBases = [
          [54, 89, 3], [64, 86, 3], [76, 88, 4], [83, 85, 3], [95, 87, 3], [105, 90, 3]
        ];
        trunkBases.forEach(([cx, baseY, tw]) => {
          const tx = Math.round(cx - tw / 2);
          rect(sctx, tx - 1, baseY - 2, tw + 2, 2, PAL.outline);
          rect(sctx, tx, baseY - 3, tw, 3, PAL.trunkMid);
          rect(sctx, tx, baseY - 3, 1, 3, PAL.trunkDark);
          rect(sctx, tx - 1, baseY, tw + 2, 1, PAL.snowShadow);
        });
      }

      buildStaticScene();

      const twinkleStars = [
        { x: 56, y: 31, phase: 0.0, speed: 0.045, col: PAL.starPink },
        { x: 78, y: 23, phase: 1.8, speed: 0.038, col: PAL.starWhite },
        { x: 108, y: 38, phase: 3.4, speed: 0.052, col: PAL.starLavender },
        { x: 42, y: 53, phase: 2.1, speed: 0.042, col: PAL.starWhite },
        { x: 117, y: 57, phase: 4.5, speed: 0.048, col: PAL.starPink }
      ];

      const snowflakes = Array.from({ length: 48 }, (_, i) => ({
        x: 32 + ((i * 29) % 96),
        y: 18 + ((i * 19) % 72),
        vy: 0.14 + (i % 4) * 0.05,
        swayAmp: 0.6 + (i % 3) * 0.45,
        swayFreq: 0.024 + (i % 5) * 0.006,
        phase: (i * 137.5) % 360,
        size: i % 6 === 0 ? 2 : 1,
        alpha: i % 3 === 0 ? 0.8 : 1
      }));

      let frame = 0;

      function renderLoop() {
        frame++;
        ctx.clearRect(0, 0, W, H);

        const floatY = Math.round(Math.sin(frame * 0.045) * 2);
        ctx.drawImage(staticBuffer, 0, floatY);

        twinkleStars.forEach((st) => {
          const pulse = Math.sin(frame * st.speed + st.phase);
          const sy = st.y + floatY;
          if (!isInsideSkyDome(st.x, st.y)) return;

          if (pulse > 0.25) {
            px(ctx, st.x, sy, PAL.starWhite);
            px(ctx, st.x - 1, sy, st.col);
            px(ctx, st.x + 1, sy, st.col);
            px(ctx, st.x, sy - 1, st.col);
            px(ctx, st.x, sy + 1, st.col);
          } else if (pulse > -0.35) {
            px(ctx, st.x, sy, st.col);
          }
        });

        snowflakes.forEach((fl) => {
          fl.y += fl.vy;
          if (fl.y > 90) {
            fl.y = 18 + Math.random() * 14;
            fl.x = 34 + Math.random() * 92;
          }

          const rx = Math.round(fl.x + Math.sin(frame * fl.swayFreq + fl.phase) * fl.swayAmp);
          const ry = Math.round(fl.y);

          if (isInsideSkyDome(rx, ry)) {
            ctx.fillStyle = fl.alpha < 1 ? PAL.snowMid : PAL.snowBright;
            ctx.fillRect(rx, ry + floatY, fl.size, fl.size);
          }
        });

        requestAnimationFrame(renderLoop);
      }

      renderLoop();

      // --- Typewriter Poem Sequence Synchronized With Progress Bar ---
      const POEM_LINES = [
        'The woods are lovely,',
        'dark and deep,',
        'But I have promises to keep,',
        'And miles to go before I sleep,'
      ];

      const loaderText = document.getElementById('loaderText');
      const progressBarFill = document.getElementById('progressBarFill');

      const TYPE_DELAY = 125;
      const BACKSPACE_DELAY = 68;
      const HOLD_AFTER_LINE = 1150;
      const PAUSE_BETWEEN_LINES = 420;
      const HOLD_AT_COMPLETE = 1750;

      let lineIdx = 0;
      let charIdx = 0;
      let phase = 'typing'; // 'typing' | 'holdLine' | 'erasing' | 'holdEnd' | 'pauseNext'
      let typewriterTimer = null;

      function updateSynchronizedProgress() {
        const totalLines = POEM_LINES.length;
        const currentLine = POEM_LINES[lineIdx] || '';
        const lineLen = Math.max(1, currentLine.length);

        let lineFraction = 0;
        if (phase === 'typing') {
          lineFraction = charIdx / lineLen;
        } else if (phase === 'holdLine') {
          lineFraction = 1;
        } else if (phase === 'erasing') {
          // Keep the line's progress reached during typing while backspacing, or advance slightly
          lineFraction = 1;
        } else if (phase === 'holdEnd') {
          lineFraction = 1;
        } else if (phase === 'pauseNext') {
          lineFraction = 0;
        }

        // Across 4 lines: line 0 advances 0..25%, line 1 -> 25..50%, line 2 -> 50..75%, line 3 -> 75..100%
        const completedBeforeLine = (lineIdx / totalLines) * 100;
        const currentLineContribution = (lineFraction / totalLines) * 100;
        const pct = Math.min(100, Math.max(0, completedBeforeLine + currentLineContribution));

        if (progressBarFill) {
          progressBarFill.style.width = `${pct.toFixed(2)}%`;
        }
      }

      function stepTypewriter() {
        const currentLine = POEM_LINES[lineIdx];

        if (phase === 'typing') {
          charIdx = Math.min(currentLine.length, charIdx + 1);
          loaderText.textContent = currentLine.slice(0, charIdx);
          updateSynchronizedProgress();

          if (charIdx >= currentLine.length) {
            const isLastLine = lineIdx === POEM_LINES.length - 1;
            phase = isLastLine ? 'holdEnd' : 'holdLine';
            typewriterTimer = setTimeout(stepTypewriter, isLastLine ? HOLD_AT_COMPLETE : HOLD_AFTER_LINE);
          } else {
            typewriterTimer = setTimeout(stepTypewriter, TYPE_DELAY);
          }
        } else if (phase === 'holdLine') {
          phase = 'erasing';
          typewriterTimer = setTimeout(stepTypewriter, BACKSPACE_DELAY);
        } else if (phase === 'erasing') {
          charIdx = Math.max(0, charIdx - 1);
          loaderText.textContent = currentLine.slice(0, charIdx);

          if (charIdx <= 0) {
            lineIdx += 1;
            charIdx = 0;
            phase = 'pauseNext';
            updateSynchronizedProgress();
            typewriterTimer = setTimeout(stepTypewriter, PAUSE_BETWEEN_LINES);
          } else {
            typewriterTimer = setTimeout(stepTypewriter, BACKSPACE_DELAY);
          }
        } else if (phase === 'holdEnd') {
          // After reaching 100% on the 4th line, backspace and reset progress bar cleanly for next loop
          phase = 'erasing';
          typewriterTimer = setTimeout(stepTypewriter, BACKSPACE_DELAY);
        } else if (phase === 'pauseNext') {
          if (lineIdx >= POEM_LINES.length) {
            lineIdx = 0;
            charIdx = 0;
            if (progressBarFill) {
              progressBarFill.style.width = '0%';
            }
          }
          phase = 'typing';
          typewriterTimer = setTimeout(stepTypewriter, TYPE_DELAY);
        }
      }

      loaderText.textContent = '';
      updateSynchronizedProgress();
      typewriterTimer = setTimeout(stepTypewriter, 350);

      // --- Interactive Preview Controls ---
      const previewStage = document.getElementById('previewStage');
      const bgButtons = document.querySelectorAll('.bg-toggle-btn');
      const scaleButtons = document.querySelectorAll('.scale-btn');
      const toggleProgress = document.getElementById('toggleProgress');
      const progressBarWrap = document.getElementById('progressBarWrap');
      const copySnippetBtn = document.getElementById('copySnippetBtn');
      const toastNotification = document.getElementById('toastNotification');
      const clipboardHelper = document.getElementById('clipboardHelper');

      bgButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const mode = btn.getAttribute('data-bg');
          bgButtons.forEach((b) => {
            b.classList.remove('bg-white', 'text-slate-900', 'shadow-xs');
            b.classList.add('text-slate-600');
          });
          btn.classList.add('bg-white', 'text-slate-900', 'shadow-xs');
          btn.classList.remove('text-slate-600');

          previewStage.classList.remove('bg-white', 'bg-slate-950', 'bg-checkerboard');
          loaderText.classList.remove('text-slate-700', 'text-slate-200', 'text-slate-800');

          if (mode === 'dark') {
            previewStage.classList.add('bg-slate-950');
            loaderText.classList.add('text-slate-200');
          } else if (mode === 'checker') {
            previewStage.classList.add('bg-checkerboard');
            loaderText.classList.add('text-slate-800');
          } else {
            previewStage.classList.add('bg-white');
            loaderText.classList.add('text-slate-700');
          }
        });
      });

      scaleButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const scale = Number(btn.getAttribute('data-scale')) || 2;
          scaleButtons.forEach((b) => {
            b.classList.remove('bg-white', 'text-slate-900', 'shadow-xs');
            b.classList.add('text-slate-600');
          });
          btn.classList.add('bg-white', 'text-slate-900', 'shadow-xs');
          btn.classList.remove('text-slate-600');

          canvas.style.width = `${W * scale}px`;
          canvas.style.height = `${H * scale}px`;
        });
      });

      toggleProgress.addEventListener('change', (e) => {
        if (e.target.checked) {
          progressBarWrap.classList.remove('hidden');
          updateSynchronizedProgress();
        } else {
          progressBarWrap.classList.add('hidden');
        }
      });

      // Build standalone embeddable snippet with the typewriter poem & synchronized progress bar
      function getEmbeddableSnippet() {
        const openScript = '\x3Cscript>';
        const closeScript = '\x3C/script>';
        return [
          '<!-- Pixel Pine Forest Website Loader -->',
          '<div id="pine-forest-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none;max-width:100%;">',
          '  <canvas id="pine-loader-canvas" width="160" height="136" style="width:320px;height:272px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;"></canvas>',
          '  <div id="pine-loader-poem" style="font-family:monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;color:#334155;min-height:20px;text-align:center;"></div>',
          '  <div style="width:208px;height:10px;background:#e2e8f0;padding:2px;border:1px solid #94a3b8;box-sizing:border-box;">',
          '    <div id="pine-loader-bar" style="width:0%;height:100%;background:#059669;transition:width 75ms linear;"></div>',
          '  </div>',
          '</div>',
          openScript,
          '(function () {',
          '  const c = document.getElementById("pine-loader-canvas");',
          '  if (!c) return;',
          '  const ctx = c.getContext("2d", { alpha: true });',
          '  ctx.imageSmoothingEnabled = false;',
          '  const W = 160, H = 136;',
          '  const buf = document.createElement("canvas");',
          '  buf.width = W; buf.height = H;',
          '  const sctx = buf.getContext("2d", { alpha: true });',
          '  sctx.imageSmoothingEnabled = false;',
          '  const PAL = {',
          '    outline: "#161b18", sky1: "#2b134d", sky2: "#3f1c6e", sky3: "#56278e",',
          '    sky4: "#7238a8", sky5: "#9452bd", sky6: "#b675cf", skyGlow: "#d199db",',
          '    trunkDark: "#472511", trunkMid: "#6e3b1b", trunkLight: "#945429",',
          '    pineDark: "#173d24", pineMid: "#266134", pineBright: "#3d8c40", pineLime: "#63b349",',
          '    snowShadow: "#9fc5e8", snowMid: "#cfe6fa", snowBright: "#ffffff",',
          '    grassDark: "#234a1c", grassMid: "#3d7a24", grassLight: "#63a82c", grassTip: "#89cc3d",',
          '    mudOutline: "#1c120c", mudDark: "#3d2312", mudMid: "#5c361c", mudLight: "#7a4a27"',
          '  };',
          '  const px = (t, x, y, col) => { t.fillStyle = col; t.fillRect(x | 0, y | 0, 1, 1); };',
          '  const rect = (t, x, y, w, h, col) => { t.fillStyle = col; t.fillRect(x | 0, y | 0, w | 0, h | 0); };',
          '  const inDome = (x, y) => ((x - 80) * (x - 80) + (y - 68) * (y - 68) <= 2916) && y <= 93;',
          '  for (let y = 12; y <= 94; y++) {',
          '    for (let x = 24; x <= 136; x++) {',
          '      const d = Math.hypot(x - 80, y - 68);',
          '      if (d <= 54 && y <= 92) {',
          '        const g = Math.hypot((x - 80) * 0.92, (y - 77) * 1.08);',
          '        let col = g < 17 ? PAL.skyGlow : g < 24 ? PAL.sky6 : g < 31 ? PAL.sky5 : g < 38 ? PAL.sky4 : g < 45 ? PAL.sky3 : g < 52 ? PAL.sky2 : PAL.sky1;',
          '        if (d > 52.85) col = "#220e3d";',
          '        px(sctx, x, y, col);',
          '      }',
          '    }',
          '  }',
          '  function tree(cx, baseY, h, maxW, st) {',
          '    const topY = baseY - h, trH = Math.max(5, Math.round(h * 0.19)), fBot = baseY - trH, fH = fBot - topY;',
          '    const trW = maxW >= 13 ? 4 : 3, tx = Math.round(cx - trW / 2);',
          '    rect(sctx, tx - 1, fBot - 1, trW + 2, trH + 2, PAL.outline);',
          '    rect(sctx, tx, fBot, trW, trH, PAL.trunkMid);',
          '    rect(sctx, tx, fBot, 1, trH, PAL.trunkDark);',
          '    const tiers = maxW >= 13 ? 5 : 4, pix = new Map();',
          '    for (let t = 0; t < tiers; t++) {',
          '      const t0 = Math.round(topY + fH * (t / tiers) * 0.86);',
          '      const t1 = Math.min(fBot, Math.round(topY + fH * Math.min(1, (t + 1.22) / tiers)));',
          '      const tW = Math.max(2, Math.round(maxW * (0.34 + 0.66 * ((t + 1) / tiers))));',
          '      for (let y = t0; y <= t1; y++) {',
          '        const lp = (y - t0) / Math.max(1, t1 - t0);',
          '        let hw = Math.round(tW * Math.pow(lp, 0.85));',
          '        if (y === t1 && tW > 3) hw += 1;',
          '        for (let dx = -hw; dx <= hw; dx++) {',
          '          const x = cx + dx, nx = dx / Math.max(1, hw);',
          '          let col = st === "lime" ? PAL.pineLime : PAL.pineBright;',
          '          if (nx < -0.45) col = st === "lime" ? PAL.pineBright : PAL.pineMid;',
          '          else if (nx > 0.35 || lp > 0.78) col = st === "lime" ? PAL.pineMid : PAL.pineDark;',
          '          const snow = (t < tiers - 1 && lp >= 0.48 && lp <= 0.76 && Math.abs(dx) <= hw - 1) || (t === 0 && lp <= 0.45 && Math.abs(dx) <= 1);',
          '          if (snow && ((x * 7 + y * 13 + t * 5) % 5 !== 0)) col = lp > 0.66 ? PAL.snowShadow : PAL.snowBright;',
          '          pix.set(x + "," + y, col);',
          '        }',
          '      }',
          '    }',
          '    pix.forEach((_, k) => {',
          '      const [x, y] = k.split(",").map(Number);',
          '      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny]) => { if (!pix.has(nx+","+ny)) px(sctx, nx, ny, PAL.outline); });',
          '    });',
          '    pix.forEach((col, k) => { const [x, y] = k.split(",").map(Number); px(sctx, x, y, col); });',
          '  }',
          '  tree(64,86,34,10,"lime"); tree(83,85,33,10,"emerald"); tree(95,87,29,9,"lime");',
          '  tree(54,90,30,10,"emerald"); tree(105,90,25,8,"lime"); tree(76,89,39,14,"emerald");',
          '  const isl = new Map();',
          '  for (let x = 28; x <= 132; x++) {',
          '    const nx = (x - 80) / 52;',
          '    if (Math.abs(nx) > 1) continue;',
          '    const topY = Math.round(87 + Math.pow(Math.abs(nx), 2.4) * 7 + Math.sin(x * 0.22) * 1.2);',
          '    const botY = Math.round(94 + Math.cos(nx * Math.PI * 0.5) * 12 + Math.max(0, 1 - Math.abs(x - 79) / 14) * 8 + Math.exp(-Math.pow((x - 53) / 7, 2)) * 3.5 + Math.exp(-Math.pow((x - 105) / 7, 2)) * 3 + Math.sin(x * 0.52) * 1.1);',
          '    const sMask = Math.cos(nx * Math.PI * 0.52);',
          '    const sThick = sMask > 0.28 ? Math.max(0, Math.round(sMask * 7 + Math.sin(x * 0.35) * 1.2)) : 0;',
          '    const gThick = Math.round(4 + Math.abs(Math.sin(x * 0.4)) * 2.5);',
          '    for (let y = topY; y <= botY; y++) {',
          '      const d = y - topY, b = botY - y;',
          '      let col = d < sThick ? (d === 0 ? PAL.snowBright : d >= sThick - 1 ? PAL.snowShadow : PAL.snowMid)',
          '        : d < sThick + gThick ? ((d - sThick === 0) ? (x % 3 === 0 ? PAL.grassTip : PAL.grassLight) : (d - sThick >= gThick - 1 ? PAL.grassDark : PAL.grassMid))',
          '        : (b <= 2 || nx > 0.45 ? PAL.mudDark : ((x * 11 + y * 17) % 7 < 4 ? PAL.mudLight : PAL.mudMid));',
          '      isl.set(x + "," + y, col);',
          '    }',
          '  }',
          '  isl.forEach((_, k) => {',
          '    const [x, y] = k.split(",").map(Number);',
          '    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny]) => { if (!isl.has(nx+","+ny)) px(sctx, nx, ny, ny < 95 ? PAL.outline : PAL.mudOutline); });',
          '  });',
          '  isl.forEach((col, k) => { const [x, y] = k.split(",").map(Number); px(sctx, x, y, col); });',
          '  [[54,89,3],[64,86,3],[76,88,4],[83,85,3],[95,87,3],[105,90,3]].forEach(([cx, baseY, tw]) => {',
          '    const tx = Math.round(cx - tw / 2);',
          '    rect(sctx, tx - 1, baseY - 2, tw + 2, 2, PAL.outline);',
          '    rect(sctx, tx, baseY - 3, tw, 3, PAL.trunkMid);',
          '    rect(sctx, tx, baseY - 3, 1, 3, PAL.trunkDark);',
          '    rect(sctx, tx - 1, baseY, tw + 2, 1, PAL.snowShadow);',
          '  });',
          '  const flakes = Array.from({length: 44}, (_, i) => ({',
          '    x: 32 + ((i * 29) % 96), y: 20 + ((i * 19) % 70),',
          '    vy: 0.14 + (i % 4) * 0.05, amp: 0.6 + (i % 3) * 0.45,',
          '    freq: 0.025 + (i % 5) * 0.006, phase: (i * 137.5) % 360, size: i % 5 === 0 ? 2 : 1',
          '  }));',
          '  let f = 0;',
          '  function loop() {',
          '    f++;',
          '    ctx.clearRect(0, 0, W, H);',
          '    const fy = Math.round(Math.sin(f * 0.045) * 2);',
          '    ctx.drawImage(buf, 0, fy);',
          '    flakes.forEach(fl => {',
          '      fl.y += fl.vy;',
          '      if (fl.y > 90) { fl.y = 18 + Math.random() * 14; fl.x = 34 + Math.random() * 92; }',
          '      const rx = Math.round(fl.x + Math.sin(f * fl.freq + fl.phase) * fl.amp), ry = Math.round(fl.y);',
          '      if (inDome(rx, ry)) rect(ctx, rx, ry + fy, fl.size, fl.size, "#ffffff");',
          '    });',
          '    requestAnimationFrame(loop);',
          '  }',
          '  loop();',
          '  const lines = ["The woods are lovely,", "dark and deep,", "But I have promises to keep,", "And miles to go before I sleep,"];',
          '  const poemEl = document.getElementById("pine-loader-poem");',
          '  const barEl = document.getElementById("pine-loader-bar");',
          '  let li = 0, ci = 0, st = "typing";',
          '  function setBar(frac) {',
          '    if (!barEl) return;',
          '    const pct = Math.min(100, Math.max(0, ((li + frac) / lines.length) * 100));',
          '    barEl.style.width = pct.toFixed(2) + "%";',
          '  }',
          '  function tick() {',
          '    const line = lines[li];',
          '    if (st === "typing") {',
          '      ci = Math.min(line.length, ci + 1);',
          '      if (poemEl) poemEl.textContent = line.slice(0, ci);',
          '      setBar(ci / Math.max(1, line.length));',
          '      if (ci >= line.length) {',
          '        const last = li === lines.length - 1;',
          '        st = last ? "holdEnd" : "holdLine";',
          '        setTimeout(tick, last ? 1750 : 1150);',
          '      } else setTimeout(tick, 125);',
          '    } else if (st === "holdLine") {',
          '      st = "erasing"; setTimeout(tick, 68);',
          '    } else if (st === "erasing") {',
          '      ci = Math.max(0, ci - 1);',
          '      if (poemEl) poemEl.textContent = line.slice(0, ci);',
          '      if (ci <= 0) { li += 1; ci = 0; st = "pauseNext"; setBar(0); setTimeout(tick, 420); }',
          '      else setTimeout(tick, 68);',
          '    } else if (st === "holdEnd") {',
          '      st = "erasing"; setTimeout(tick, 68);',
          '    } else {',
          '      if (li >= lines.length) { li = 0; ci = 0; if (barEl) barEl.style.width = "0%"; }',
          '      st = "typing"; setTimeout(tick, 125);',
          '    }',
          '  }',
          '  tick();',
          '})();',
          closeScript
        ].join('\n');
      }

      let toastTimeout = null;
      copySnippetBtn.addEventListener('click', () => {
        const code = getEmbeddableSnippet();
        clipboardHelper.value = code;
        clipboardHelper.select();
        clipboardHelper.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
        } catch (err) {
          // Fallback ignored silently if blocked
        }
        window.getSelection().removeAllRanges();

        toastNotification.classList.remove('opacity-0', 'translate-y-2');
        toastNotification.classList.add('opacity-100', 'translate-y-0');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastNotification.classList.add('opacity-0', 'translate-y-2');
          toastNotification.classList.remove('opacity-100', 'translate-y-0');
        }, 2800);
      });
    })();
  </script>
</body>
</html>
